name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.29.2'

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lumideck_test
          MYSQL_USER: lumideck_test_user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure test environment
        run: cp packages/agent/.env.test.example packages/agent/.env.test.local
      - name: Push test schema
        run: pnpm -F @big-ppt/agent db:push:test
      - run: pnpm lint
      - run: pnpm type-check
      - name: Unit and integration tests
        run: |
          pnpm -F @big-ppt/agent test
          pnpm -F @big-ppt/creator test
          pnpm -F @big-ppt/shared test
          pnpm -F @big-ppt/slidev test
      - name: Creator production build and bundle budget
        run: pnpm -F @big-ppt/creator build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    needs: quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lumideck_test
          MYSQL_USER: lumideck_test_user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp packages/agent/.env.test.example packages/agent/.env.test.local
      - run: pnpm -F @big-ppt/agent db:push:test
      - run: pnpm -F @big-ppt/e2e install-browsers --with-deps
      - name: Run deterministic browser flows
        run: pnpm -F @big-ppt/e2e exec playwright test --grep-invert "visual regression"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
